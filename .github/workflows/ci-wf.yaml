name: ci-wf
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Liting Job
        run: echo "Starting Litning of HTML & CSS Files"
      - name: Clone Repo On the Runner
        uses: actions/checkout@v4
      - name: Install Dev Dependencies
        run: npm install
      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files
        run: npx stylelint "**/*.css"

  build-job:
    runs-on: ubuntu-latest
    needs: "linting-job"
    steps:
      - name: Build Job
        run: echo "Build Job Goint to Start"
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Install Dependecies
        run: npm install
      - name: Build Website With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" --no-cache

  image-build-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Image
        run: docker image build -t ${{ secrets.DOCKERHUB_USERNAME }}/app-latest .
      - name: List images to Docker
        run:  docker image ls
      - name: Create Container on the runner
        run: docker container run -d -p 8080:80 ${{ secrets.DOCKERHUB_USERNAME }}/app-latest
      - name: List Containers to Docker
        run: docker container ls
      - name: Push Image to Docker Hub
        run: docker image push ${{ secrets.DOCKERHUB_USERNAME }}/app-latest


