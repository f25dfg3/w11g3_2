name: ci-wf
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Liting Job
        run: echo "Starting Litning of HTML & CSS Files"
      - name: Clone Repo On the Runner
        uses: actions/checkout@v4
      - name: Install Dev Dependencies
        run: npm install
      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files
        run: npx stylelint "**/*.css"

  build-job:
    runs-on: ubuntu-latest
    needs: "linting-job"
    steps:
      - name: Build Job
        run: echo "Build Job Goint to Start"
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Install Dependecies
        run: npm install
      - name: Build Website With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" --no-cache

  image-build-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-latest
          platforms: linux/amd64
      - name: List local Docker images
        run: docker image ls


